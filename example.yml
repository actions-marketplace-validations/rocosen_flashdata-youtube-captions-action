name: YouTube Uploader Captions - FlashData
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Export existing uploader-caption segments with timestamps and language
          provenance for a subtitle review pipeline.
        id: data
        uses: rocosen/flashdata-youtube-captions-action@v0.1.0
        with:
          api-key: ${{ secrets.FLASHDATA_API_KEY }}
          video-id: dQw4w9WgXcQ
          options-json: '{"language":"en","auto":false}'
      - name: Save data for the next pipeline stage
        uses: actions/upload-artifact@v4
        with:
          name: youtube-captions
          path: ${{ steps.data.outputs.artifact-directory }}
          retention-days: 7
